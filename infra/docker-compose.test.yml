services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pmtool
      POSTGRES_PASSWORD: pmtool_test
      POSTGRES_DB: pmtool_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmtool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
