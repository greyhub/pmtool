packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  cpu-features: true
  esbuild: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true

# Security: transitive dependencies pinned to patched releases (advisories found by `pnpm audit --prod`).
overrides:
  multer: '>=2.3.0'
  lodash: '>=4.18.1'
  js-yaml: '>=4.3.2'
  postcss: '>=8.5.18'
  qs: '>=6.16.0'
  body-parser: '>=1.20.6 <2'
