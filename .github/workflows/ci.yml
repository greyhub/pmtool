name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  # Dummy secrets are fine here: nothing in CI talks to a real JWT-protected
  # service outside this workflow, and each job that needs a live DB starts
  # its own (Testcontainers in `integration`, docker compose in `e2e`).
  DATABASE_URL: postgresql://pmtool:pmtool_dev@localhost:5432/pmtool_dev
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-placeholder-at-least-32-chars
  JWT_REFRESH_SECRET: ci-refresh-secret-placeholder-at-least-32-chars
  CORS_ORIGIN: http://localhost:3000
  # E2E and integration tests register many users from one IP.
  RATE_LIMIT_ENABLED: 'false'

jobs:
  checks:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate
      - name: Lint, typecheck, build, unit test (all packages)
        run: pnpm exec turbo run build lint typecheck test

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate
      - name: Build workspace dependencies
        # Each job starts from a fresh checkout with no build state from the
        # `checks` job, so apps/api's workspace:* dependency on
        # @pmtool/shared-types resolves to an unbuilt dist/ without this —
        # Vite fails with "Failed to resolve entry for package" instantly.
        run: pnpm --filter @pmtool/shared-types run build
      - name: Run integration tests
        # Spins its own ephemeral Postgres via Testcontainers, using the
        # Docker daemon already available on the ubuntu-latest runner.
        run: pnpm --filter api run test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate

      - name: Start Postgres & Redis
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Apply migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Build API and web
        # turbo's --filter matches the exact package.json "name" (unlike
        # pnpm's --filter, which accepts the "api"/"web" shorthand) — so
        # this needs the full @pmtool/ scope.
        run: pnpm exec turbo run build --filter=@pmtool/api --filter=@pmtool/web

      - name: Start API (background)
        working-directory: apps/api
        run: |
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/v1/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "API failed to become healthy"; cat /tmp/api.log; exit 1

      - name: Start web (background)
        working-directory: apps/web
        run: |
          nohup pnpm run start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/vi || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "Web failed to become healthy"; cat /tmp/web.log; exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: apps/web
        run: pnpm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
